name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Debian 12 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: debian:bookworm
      # Root, loop devices, device-mapper and privileged xattrs are exercised.
      options: --privileged --volume /lib/modules:/lib/modules:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and test dependencies
        run: sh .github/scripts/install-dependencies.sh
      - name: Build and run the complete CTest suite
        run: sh .github/scripts/test.sh
